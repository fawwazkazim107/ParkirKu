<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ParkirKu</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    .kosong-besar { font-size: 3rem; font-weight: bold; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .slot {
      padding: 12px 8px;
      border-radius: 8px;
      text-align: center;
      background: #0a0a0a;
      border: 2px solid;
    }
    .Kosong { border-color: #2e9e4f; }
    .Terisi { border-color: #d33; }
    .mobil {
      width: 30px; height: 48px; margin: 0 auto 6px;
      border-radius: 9px; background: #4da6ff;
      background-image: linear-gradient(#000 0 0), linear-gradient(#000 0 0);
      background-size: 70% 22%, 70% 14%;
      background-position: 50% 16%, 50% 86%;
      background-repeat: no-repeat;
    }
    .Kosong .mobil { visibility: hidden; }
  </style>
</head>
<body>
  <h1>ParkirKu</h1>
  <p>Slot kosong saat ini:</p>
  <div class="kosong-besar"><span id="kosong">-</span> / <span id="total">-</span></div>

  <h2>Daftar Slot</h2>
  <div id="daftar"></div>

  <h2>Riwayat Keterisian per Jam</h2>
  <canvas id="grafik"></canvas>

  <script>
    let chart;
    Chart.defaults.color = "#fff";

    async function muatSlot() {
      const data = await (await fetch("/api/slots")).json();
      document.getElementById("kosong").textContent = data.ringkasan.kosong;
      document.getElementById("total").textContent = data.ringkasan.total;

      const grup = {};
      data.slots.forEach(s => (grup[s.lokasi] = grup[s.lokasi] || []).push(s));

      document.getElementById("daftar").innerHTML = Object.keys(grup).map(lokasi => {
        const kosong = grup[lokasi].filter(s => s.status === "Kosong").length;
        return `<h3>${lokasi} (${kosong} / ${grup[lokasi].length} kosong)</h3>
          <div class="grid">` + grup[lokasi].map(s =>
            `<div class="slot ${s.status}">
              <div class="mobil"></div><b>${s.kode}</b><br>${s.status}
            </div>`).join("") + `</div>`;
      }).join("");
    }

    async function muatRiwayat() {
      const data = await (await fetch("/api/riwayat")).json();
      const labels = data.map(d => d.jam);
      const nilai = data.map(d => d.persen_terisi);
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("grafik"), {
        type: "bar",
        data: {
          labels,
          datasets: [{ label: "% terisi", data: nilai, backgroundColor: "#4da6ff" }]
        },
        options: {
          scales: {
            y: { min: 0, max: 100, grid: { color: "#333" } },
            x: { grid: { color: "#333" } }
          }
        }
      });
    }

    function refresh() { muatSlot(); muatRiwayat(); }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
