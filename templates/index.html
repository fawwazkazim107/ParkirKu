<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ParkirKu</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    h1, h2, h3 { text-align: center; }
    .kosong-besar { font-size: 3rem; font-weight: bold; text-align: center; }
    .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .slot {
      box-sizing: border-box;
      width: 110px;
      padding: 12px 8px;
      border-radius: 8px;
      text-align: center;
      background: #0a0a0a;
      border: 2px solid;
    }
    .Kosong { border-color: #2e9e4f; }
    .Terisi { border-color: #d33; }
    .mobil {
      width: 30px; height: 48px; margin: 0 auto 6px;
      border-radius: 9px; background: #4da6ff;
      background-image: linear-gradient(#000 0 0), linear-gradient(#000 0 0);
      background-size: 70% 22%, 70% 14%;
      background-position: 50% 16%, 50% 86%;
      background-repeat: no-repeat;
    }
    .Kosong .mobil { visibility: hidden; }
  </style>
</head>
<body>
  <h1>ParkirKu</h1>
  <p style="text-align:center">Slot kosong saat ini:</p>
  <div class="kosong-besar"><span id="kosong">-</span> / <span id="total">-</span></div>

  <h2>Daftar Slot</h2>
  <div id="daftar"></div>

  <h2>Slot Terisi per Area</h2>
  <canvas id="grafik-area"></canvas>

  <script>
    Chart.defaults.color = "#fff";
    let chart;

    function gambarBatang(labels, nilai, max) {
      if (chart) {
        chart.data.labels = labels;
        chart.data.datasets[0].data = nilai;
        chart.options.scales.y.max = max;
        chart.update();
        return;
      }
      chart = new Chart(document.getElementById("grafik-area"), {
        type: "bar",
        data: {
          labels,
          datasets: [{ label: "Slot terisi", data: nilai, backgroundColor: "#4da6ff" }]
        },
        options: {
          scales: {
            y: { min: 0, max, ticks: { stepSize: 1 }, grid: { color: "#333" } },
            x: { grid: { color: "#333" } }
          }
        }
      });
    }

    async function muatSlot() {
      const data = await (await fetch("/api/slots")).json();
      document.getElementById("kosong").textContent = data.ringkasan.kosong;
      document.getElementById("total").textContent = data.ringkasan.total;

      const grup = {};
      data.slots.forEach(s => (grup[s.lokasi] = grup[s.lokasi] || []).push(s));

      document.getElementById("daftar").innerHTML = Object.keys(grup).map(lokasi => {
        const kosong = grup[lokasi].filter(s => s.status === "Kosong").length;
        return `<h3>${lokasi} (${kosong} / ${grup[lokasi].length} kosong)</h3>
          <div class="grid">` + grup[lokasi].map(s =>
            `<div class="slot ${s.status}">
              <div class="mobil"></div><b>${s.kode}</b><br>${s.status}
            </div>`).join("") + `</div>`;
      }).join("");

      const namaArea = Object.keys(grup);
      const terisiPerArea = namaArea.map(a => grup[a].filter(s => s.status === "Terisi").length);
      const maksSlot = Math.max(...namaArea.map(a => grup[a].length));
      gambarBatang(namaArea, terisiPerArea, maksSlot);
    }

    muatSlot();
    setInterval(muatSlot, 5000);
  </script>
</body>
</html>
